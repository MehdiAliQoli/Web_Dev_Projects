<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="screen"></div>
    <div id="main">
      <button class="but">7</button>
      <button class="but">8</button>
      <button class="but">9</button>
      <button class="but but_op">+</button>

      <button class="but">4</button>
      <button class="but">5</button>
      <button class="but">6</button>
      <button class="but but_op">-</button>

      <button class="but">1</button>
      <button class="but">2</button>
      <button class="but">3</button>
      <button class="but but_op">*</button>

      <button class="but zero">0</button>
      <button class="but but_op" id="result">=</button>
      <button class="but but_op" id="clear">C</button>
    </div>
  </body>
  <script src="Data_types.js"></script>
</html>
